<html lang="ko">
<head>
<meta charset="utf-8">

<style>
  @font-face { font-family: "Pretendard"; src: url("fonts/PretendardSubset.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    --accent: #ff6a1f; --accent2: #ffb23f; --ink: #f4f5f7; --mute: rgba(244,245,247,.62);
    --panel: rgba(18,20,27,.86); --panel2: rgba(255,255,255,.07); --line: rgba(255,255,255,.12);
    --good: #59d98e; --warn: #ff5a4a; --gold: #ffd36b;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c9d5e0; color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  body.armed:not(.touch) #c { cursor: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 14px 40px rgba(0,0,0,.35); }
  .num { font-variant-numeric: tabular-nums; }

  /* building labels */
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; will-change: transform; }
  .lbl span { position: absolute; bottom: 4px; left: 0; transform: translateX(-50%); white-space: nowrap; font-size: 11.5px; font-weight: 700; padding: 3px 8px 4px; border-radius: 8px;
    background: rgba(18,20,27,.72); color: #fff; pointer-events: none; }
  .lbl.place span, .lbl.minor span, .lbl.gate span { background: rgba(255,255,255,.82); color: #3b3f46; font-weight: 600; font-size: 10.5px; }
  .lbl.heritage span { background: rgba(124,42,32,.88); color: #fff4e6; }
  .lbl .hp { display: block; height: 3px; margin: 3px 0 0; background: rgba(255,255,255,.18); border-radius: 2px; overflow: hidden; }
  .lbl .hp b { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff4a2a, #ffb23f); transition: width .2s; }
  .lbl.dead span { background: rgba(40,42,48,.8); color: #9a9ea6; text-decoration: line-through; }
  .lbl.dead .hp { display: none; }
  body.menu #labels, body.result #labels { display: none; }

  /* loading */
  #loading { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; background: #14161c; transition: opacity .5s; }
  #loading.show { display: grid; }
  #loading .box { width: min(300px, 80vw); text-align: center; }
  #loading .logo { font-size: 34px; font-weight: 900; letter-spacing: -.04em; }
  #loading .logo b, .title b { color: var(--accent); }
  #loading .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); margin: 18px 0 10px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 8%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }
  #loadTxt { font-size: 13px; color: var(--mute); min-height: 1.4em; }
  #reloadBtn[hidden] { display: none; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  body:not(.playing) #hud { display: none; }
  #top { position: absolute; left: 50%; top: calc(10px + var(--sat)); transform: translateX(-50%); display: flex; align-items: stretch; gap: 8px; }
  #timer, #scoreBox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: grid; place-items: center; padding: 6px 14px; }
  #timer { min-width: 70px; font-size: 22px; font-weight: 800; }
  #timer.low { color: #fff; background: rgba(214,48,32,.9); animation: beat 1s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(1.06); } }
  #scoreBox { min-width: 128px; padding: 4px 16px 6px; }
  #scoreBox small { font-size: 10.5px; font-weight: 700; color: var(--mute); letter-spacing: .08em; }
  #score { font-size: 24px; font-weight: 900; line-height: 1.05; }
  #score.bump { animation: bump .25s ease-out; }
  @keyframes bump { 40% { transform: scale(1.14); color: var(--gold); } }
  #mult { position: absolute; left: 50%; top: calc(74px + var(--sat)); transform: translateX(-50%); font-size: 14px; font-weight: 900; padding: 4px 12px; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), #ff3d5a); color: #fff; opacity: 0; transition: opacity .2s; white-space: nowrap; box-shadow: 0 6px 18px rgba(255,80,40,.45); }
  #mult.on { opacity: 1; }
  #mult i { display: block; height: 3px; margin-top: 3px; border-radius: 2px; background: rgba(255,255,255,.85); transform-origin: left; }
  #muteBtn { position: absolute; right: calc(10px + var(--sar)); top: calc(10px + var(--sat)); width: 42px; height: 42px; border-radius: 13px; pointer-events: auto; font-size: 17px;
    background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; padding: 0; }
  #quitBtn { position: absolute; left: calc(10px + var(--sal)); top: calc(10px + var(--sat)); height: 42px; padding: 0 13px; border-radius: 13px; pointer-events: auto; font-size: 13px; font-weight: 700;
    background: var(--panel); border: 1px solid var(--line); }
  #feed { position: absolute; left: 50%; top: calc(108px + var(--sat)); transform: translateX(-50%); width: min(300px, 80vw); display: flex; flex-direction: column; gap: 5px; align-items: center; }
  #feed div { background: rgba(18,20,27,.78); font-size: 12.5px; padding: 6px 12px; border-radius: 10px; animation: fin .25s ease-out; transition: opacity .5s, transform .5s; white-space: nowrap; }
  #feed div.out { opacity: 0; transform: translateY(-8px); }
  #feed em { font-style: normal; color: var(--gold); font-weight: 800; margin-left: 5px; }
  #feed div.sys { background: rgba(255,106,31,.9); font-weight: 700; }
  @keyframes fin { from { opacity: 0; transform: translateY(8px); } }
  #banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%); font-size: 54px; font-weight: 900; letter-spacing: -.03em; opacity: 0; white-space: nowrap;
    text-shadow: 0 6px 30px rgba(255,90,31,.9), 0 3px 0 #a8300e; }
  #banner.show { animation: pop 1.3s ease-out forwards; }
  #banner small { display: block; font-size: 16px; text-align: center; letter-spacing: 0; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); } 28% { transform: translate(-50%,-50%) scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-60%); } }
  #pops { position: fixed; inset: 0; pointer-events: none; z-index: 15; overflow: hidden; }
  .pop { position: absolute; left: 0; top: 0; font-weight: 900; font-size: 15px; color: var(--gold); white-space: nowrap; text-shadow: 0 2px 6px rgba(0,0,0,.7); will-change: transform; }
  .pop.big { font-size: 22px; color: #fff; text-shadow: 0 3px 14px rgba(255,90,31,.95), 0 2px 0 #9b2c0c; }
  #flashFx { position: fixed; inset: 0; z-index: 16; pointer-events: none; background: #fff6e0; opacity: 0; mix-blend-mode: screen; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; z-index: 18; display: none; pointer-events: none;
    background: linear-gradient(var(--accent),var(--accent)) 50% 0/2px 13px no-repeat, linear-gradient(var(--accent),var(--accent)) 50% 100%/2px 13px no-repeat,
      linear-gradient(var(--accent),var(--accent)) 0 50%/13px 2px no-repeat, linear-gradient(var(--accent),var(--accent)) 100% 50%/13px 2px no-repeat; filter: drop-shadow(0 0 2px rgba(0,0,0,.6)); }
  body.armed:not(.touch) #crosshair { display: block; }

  /* weapon dock */
  #dock { position: absolute; left: 50%; bottom: calc(10px + var(--sab)); transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; pointer-events: auto; }
  .slot { position: relative; width: 66px; height: 66px; border-radius: 14px; background: var(--panel2); border: 2px solid transparent; padding: 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: transform .1s, border-color .15s, background .15s; touch-action: manipulation; }
  .slot:active { transform: scale(.94); }
  .slot.sel { border-color: var(--accent); background: rgba(255,106,31,.22); }
  .slot .ic { width: 30px; height: 30px; position: relative; z-index: 1; }
  .slot .nm { font-size: 10.5px; font-weight: 700; position: relative; z-index: 1; white-space: nowrap; }
  .slot .key { position: absolute; left: 6px; top: 4px; font-size: 9.5px; font-weight: 800; color: var(--mute); z-index: 1; }
  .slot .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.55); }
  .slot .bar { position: absolute; left: 8px; right: 8px; bottom: 5px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; z-index: 1; }
  .slot .bar b { display: block; height: 100%; width: 0; background: var(--gold); }
  .slot.empty .ic, .slot.empty .nm { opacity: .45; }
  .slot.ready { animation: glow 1.1s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 2px rgba(255,211,107,.8), 0 0 22px rgba(255,140,40,.85); } }
  #wtip { position: absolute; left: 50%; bottom: calc(96px + var(--sab)); transform: translateX(-50%); font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 12px;
    background: rgba(18,20,27,.8); opacity: 0; transition: opacity .3s; max-width: calc(100vw - 24px); width: max-content; text-align: center; line-height: 1.45; }
  #wtip.show { opacity: 1; }
  #keys { position: absolute; right: 14px; bottom: 14px; font-size: 11.5px; color: rgba(20,22,28,.7); font-weight: 600; }
  #keys kbd { font: inherit; font-weight: 800; background: rgba(255,255,255,.7); border-radius: 4px; padding: 0 5px; }
  body.touch #keys { display: none; }

  /* screens: start, result, ranking */
  .screen { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: center; align-items: center; padding: calc(14px + var(--sat)) 14px calc(14px + var(--sab));
    background: linear-gradient(180deg, rgba(12,14,20,.05) 0%, rgba(12,14,20,.55) 55%, rgba(12,14,20,.85) 100%); transition: opacity .35s; overflow-y: auto; }
  .screen.hide { opacity: 0; pointer-events: none; visibility: hidden; }
  .card { width: min(420px, 100%); padding: 22px 20px 18px; margin: auto 0; }
  .title { font-size: 42px; font-weight: 900; letter-spacing: -.045em; line-height: 1.05; margin: 2px 0 6px; }
  .kicker { display: inline-block; font-size: 11.5px; font-weight: 800; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; background: rgba(255,106,31,.18); color: #ffb08a; }
  .lead { font-size: 14px; line-height: 1.6; color: var(--mute); margin: 8px 0 16px; }
  .field { display: block; margin-bottom: 10px; }
  .field span { display: block; font-size: 12px; font-weight: 700; color: var(--mute); margin: 0 0 6px 2px; }
  .field input, .field select { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.06); padding: 0 14px; font-size: 16px; font-weight: 600; outline: none; appearance: none; -webkit-appearance: none; }
  .field select { background-image: linear-gradient(45deg, transparent 50%, #aaa 50%), linear-gradient(135deg, #aaa 50%, transparent 50%); background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; }
  .field select option, .field select optgroup { background: #1d2028; color: #fff; }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .err { font-size: 12.5px; color: #ff8a7a; min-height: 18px; margin: -2px 0 6px 2px; }
  .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 52px; border: 0; border-radius: 14px; font-size: 16px; font-weight: 800;
    background: rgba(255,255,255,.1); transition: transform .1s, filter .15s; }
  .btn:active { transform: scale(.97); }
  .btn.main { background: linear-gradient(180deg, #ff7a2f, #f2561a); box-shadow: 0 8px 22px rgba(255,90,31,.35); }
  .btn small { font-size: 11.5px; font-weight: 600; opacity: .85; margin-top: 1px; }
  .btn[disabled] { opacity: .5; }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }
  .link { background: none; border: 0; color: var(--mute); font-size: 13px; font-weight: 700; padding: 10px; text-decoration: underline; text-underline-offset: 3px; }
  .teaser { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.05); font-size: 13px; line-height: 1.55; }
  .teaser b { color: var(--gold); }
  .teaser .hd { display: flex; justify-content: space-between; align-items: center; font-weight: 800; margin-bottom: 4px; }
  .weap { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 0 0 14px; }
  .weap div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--mute); }
  .weap svg { width: 30px; height: 30px; }

  /* result */
  #shotWrap { position: relative; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 16 / 10; margin: -6px -6px 14px; }
  #shotImg { display: block; width: 100%; height: 100%; object-fit: cover; -webkit-touch-callout: default; pointer-events: auto; }
  .bigscore { text-align: center; }
  .bigscore small { font-size: 12px; font-weight: 700; color: var(--mute); }
  .bigscore b { display: block; font-size: 46px; font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }
  .bigscore .nb { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--good); color: #0c2616; margin-top: 4px; }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0; }
  .chips div { background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px 4px; text-align: center; }
  .chips small { display: block; font-size: 11px; color: var(--mute); font-weight: 700; }
  .chips b { font-size: 17px; font-weight: 900; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,.06); margin: 16px 0 8px; }
  .tabs button { flex: 1; height: 36px; border: 0; border-radius: 9px; background: none; font-size: 13.5px; font-weight: 800; color: var(--mute); }
  .tabs button.on { background: rgba(255,255,255,.14); color: #fff; }
  .board { list-style: none; margin: 0; padding: 0; }
  .board li { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; padding: 9px 6px; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
  .board li .rk { font-weight: 900; text-align: center; color: var(--mute); }
  .board li:nth-child(1) .rk { color: #ffd36b; } .board li:nth-child(2) .rk { color: #d7dde5; } .board li:nth-child(3) .rk { color: #e2a173; }
  .board li .who { min-width: 0; }
  .board li .who b { display: block; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board li .who small { display: block; font-size: 11.5px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board li .sc { font-weight: 900; }
  .board li.me { background: rgba(255,106,31,.16); border-radius: 10px; border-bottom-color: transparent; }
  .board .empty { display: block; text-align: center; color: var(--mute); font-size: 13px; padding: 18px 0; }
  .note { font-size: 11.5px; color: var(--mute); text-align: center; margin-top: 10px; line-height: 1.5; }
  #rankCard .x { position: absolute; right: 12px; top: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); font-size: 15px; }
  #rankCard { position: relative; }
  #rankList { max-height: min(56vh, 520px); overflow-y: auto; -webkit-overflow-scrolling: touch; }

  @media (max-width: 520px) {
    .slot { width: 58px; height: 60px; border-radius: 12px; }
    .slot .ic { width: 27px; height: 27px; }
    .slot .nm { font-size: 10px; }
    #dock { gap: 5px; padding: 5px; }
    #wtip { bottom: calc(86px + var(--sab)); }
    #score { font-size: 22px; }
    #timer { font-size: 20px; min-width: 64px; }
    .title { font-size: 38px; }
    #banner { font-size: 44px; }
    .lbl span { font-size: 10.5px; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    .screen { align-items: flex-start; }
    #dock { left: auto; right: calc(10px + var(--sar)); transform: none; bottom: calc(8px + var(--sab)); }
    #wtip { left: calc(14px + var(--sal)); transform: none; bottom: 14px; }
  }
</style>
</head>
<body class="menu">
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="pops"></div>
<div id="flashFx"></div>
<div id="crosshair"></div>

<div id="hud">
  <button id="quitBtn" aria-label="그만하기">그만</button>
  <div id="top">
    <div id="timer" class="num">1:00</div>
    <div id="scoreBox"><small>점수</small><div id="score" class="num">0</div></div>
  </div>
  <div id="mult"><span id="multTxt">연쇄 ×2</span><i id="multBar"></i></div>
  <button id="muteBtn" aria-label="소리 켜기 끄기">🔊</button>
  <div id="feed"></div>
  <div id="banner"></div>
  <div id="wtip"></div>
  <div id="dock" class="panel"></div>
  <div id="keys"><kbd>1</kbd>~<kbd>5</kbd> 무기 &nbsp; <kbd>드래그</kbd> 회전 &nbsp; <kbd>WASD</kbd> 이동 &nbsp; <kbd>휠</kbd> 확대</div>
</div>

<div id="start" class="screen">
  <div class="card panel">
    <span class="kicker">기말고사 시즌 학과 대항전</span>
    <div class="title">캠퍼스 <b>부수기</b></div>
    <p class="lead">1분 동안 캠퍼스 건물을 최대한 많이 무너뜨리세요. 내 점수는 개인 랭킹에, 모든 판의 점수는 우리 과 점수에 쌓입니다.</p>
    <div class="weap" id="weapIntro"></div>
    <label class="field"><span>닉네임</span><input id="nick" maxlength="10" autocomplete="nickname" enterkeyhint="next" placeholder="랭킹에 보일 이름 (10자 이내)"></label>
    <label class="field"><span>학과</span><select id="dept"><option value="">학과를 골라 주세요</option></select></label>
    <div class="err" id="formErr"></div>
    <button class="btn main" id="btnStart">시작하기<small>제한 시간 1분</small></button>
    <div class="teaser" id="teaser"><div class="hd"><span>지금 학과 순위</span><button class="link" id="openRank" style="padding:0">전체 랭킹</button></div><div id="teaserBody">불러오는 중</div></div>
  </div>
</div>

<div id="result" class="screen hide">
  <div class="card panel">
    <div id="shotWrap"><img id="shotImg" alt="내가 부순 캠퍼스"></div>
    <div class="bigscore"><small id="resName">이번 판 점수</small><b id="resScore" class="num">0</b><span class="nb" id="resBest" hidden>개인 최고 기록</span></div>
    <div class="chips">
      <div><small>무너뜨린 건물</small><b id="resKills" class="num">0</b></div>
      <div><small>최대 연쇄</small><b id="resCombo" class="num">0</b></div>
      <div><small>전체 순위</small><b id="resRank" class="num">집계 중</b></div>
    </div>
    <div class="row">
      <button class="btn main" id="btnAgain">다시 하기</button>
      <button class="btn" id="btnShare">자랑하기</button>
    </div>
